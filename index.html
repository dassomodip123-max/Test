<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>A Question For You</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; } html, body { height: 100%; overflow: hidden; } body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient( 135deg, #ffdde1, #ff9a9e, #fecfef, #ffc3a0 ); background-size: 400% 400%; animation: gradientShift 10s ease infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px; text-align: center; } /* ========================= BACKGROUND ========================= */ @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } } .heart { position: absolute; top: 100%; color: rgba(255,255,255,0.75); font-size: 20px; pointer-events: none; animation: floatUp linear infinite; user-select: none; z-index: 1; } @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; } } /* ========================= CARD ========================= */ .card { background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); border-radius: 28px; padding: 36px 24px; max-width: 380px; width: 100%; box-shadow: 0 20px 40px rgba(255,105,135,0.35); z-index: 2; position: relative; animation: popIn 0.7s ease; } @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } } /* ========================= TOP EMOJI ========================= */ .emoji-top { font-size: 46px; margin-bottom: 8px; display: inline-block; animation: bounce 1.6s ease-in-out infinite; } @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } } /* ========================= TEXT ========================= */ h1 { font-size: 26px; color: #d6336c; margin-bottom: 6px; line-height: 1.3; } .name { background: linear-gradient( 90deg, #ff5e78, #ff8fab ); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; } .subtitle { font-size: 15px; color: #a83a5e; margin-bottom: 28px; font-weight: 500; } /* ========================= BUTTON AREA ========================= */ .btn-row { display: flex; justify-content: center; gap: 18px; position: relative; min-height: 60px; align-items: center; } button { border: none; outline: none; font-size: 17px; font-weight: 700; padding: 14px 28px; border-radius: 50px; cursor: pointer; font-family: inherit; } /* ========================= YES BUTTON ========================= */ #yesBtn { background: linear-gradient( 135deg, #ff5e78, #ff8fab ); color: white; box-shadow: 0 10px 20px rgba(255,94,120,0.4); transition: transform 0.2s ease, font-size 0.2s ease; position: relative; z-index: 5; } #yesBtn:active { transform: scale(0.95); } /* ========================= NO BUTTON ========================= */ #noBtn { background: #ffe3e9; color: #d6336c; position: relative; transition: left 0.08s ease, top 0.08s ease; touch-action: none; user-select: none; -webkit-user-select: none; white-space: nowrap; z-index: 10; } /* ========================= RESULT ========================= */ #result { display: none; margin-top: 26px; animation: popIn 0.5s ease; } #result .big-emoji { font-size: 54px; margin-bottom: 10px; } #result p { color: #d6336c; font-weight: 700; font-size: 19px; } /* ========================= HINT ========================= */ .hint { margin-top: 18px; font-size: 12.5px; color: #c17a94; opacity: 0.8; } /* ========================= MOBILE ========================= */ @media (max-width: 480px) { .card { padding: 28px 18px; } .btn-row { gap: 12px; } h1 { font-size: 24px; } } </style> </head> <body> <!-- ========================= MAIN CARD ========================= --> <div class="card" id="mainCard"> <div class="emoji-top"> 💌 </div> <h1> Hey cutie🥺 <span class="name"> pls pls </span>, </h1> <h1 style="font-size:21px; margin-bottom:0;"> will you be my gf? please🥺🥺🥺 </h1> <p class="subtitle"> . </p> <div class="btn-row" id="btnRow"> <button id="yesBtn" class="yes-size" onclick="sayYes()"> Yes </button> <button id="noBtn"> No </button> </div> <p class="hint" id="hintText"> psst, try clicking "No" 😏 </p> <div id="result"> <div class="big-emoji"> 🥹💗🎉 </div> <p> Yayyy! I knew it 😄 <br> . </p> </div> </div> <script> /* ========================================= FLOATING HEARTS ========================================= */ const heartsToUse = [ "💗", "💕", "💖", "💓", "💞", "🩷" ]; for (let i = 0; i < 22; i++) { const h = document.createElement("div"); h.className = "heart"; h.textContent = heartsToUse[ Math.floor( Math.random() * heartsToUse.length ) ]; h.style.left = Math.random() * 100 + "vw"; h.style.fontSize = (14 + Math.random() * 20) + "px"; h.style.animationDuration = (5 + Math.random() * 7) + "s"; h.style.animationDelay = (Math.random() * 8) + "s"; document.body.appendChild(h); } /* ========================================= ELEMENTS ========================================= */ const noBtn = document.getElementById("noBtn"); const yesBtn = document.getElementById("yesBtn"); const hintText = document.getElementById("hintText"); /* ========================================= DODGE SETTINGS ========================================= */ let dodgeCount = 0; /* Increase this if you want the No button to escape earlier. */ const DODGE_DISTANCE = 170; /* Keep button away from screen edges. */ const EDGE_PADDING = 20; /* ========================================= MESSAGES ========================================= */ const teaseMessages = [ 'psst, try clicking "No" 😏', "Nice try 😏", "Nope, not happening 🙅‍♀️", "Catch me if you can 🏃‍♀️", "Come onnn, click Yes already 😩", "The No button is shy 🙈", "Almost got me 😂", "Give up yet? 😌", "Still trying? 😂", "You really want to click No? 😭", "Just click Yes already 🥺", "No is not an option 😌💗" ]; /* ========================================= MOVE NO BUTTON ========================================= */ function moveNoButton(mouseX, mouseY) { dodgeCount++; /* Change hint message */ hintText.textContent = teaseMessages[ Math.min( dodgeCount - 1, teaseMessages.length - 1 ) ]; /* Make button fixed */ noBtn.style.position = "fixed"; noBtn.style.zIndex = "9999"; /* Get button size */ const btnWidth = noBtn.offsetWidth; const btnHeight = noBtn.offsetHeight; /* Available screen space */ const maxX = window.innerWidth - btnWidth - EDGE_PADDING; const maxY = window.innerHeight - btnHeight - EDGE_PADDING; let newX; let newY; /* Find a position far away from the mouse. */ let foundPosition = false; for (let i = 0; i < 100; i++) { newX = EDGE_PADDING + Math.random() * (maxX - EDGE_PADDING); newY = EDGE_PADDING + Math.random() * (maxY - EDGE_PADDING); const buttonCenterX = newX + btnWidth / 2; const buttonCenterY = newY + btnHeight / 2; const distance = Math.sqrt( Math.pow( buttonCenterX - mouseX, 2 ) + Math.pow( buttonCenterY - mouseY, 2 ) ); if ( distance > DODGE_DISTANCE ) { foundPosition = true; break; } } /* Fallback position if random search fails. */ if (!foundPosition) { newX = Math.random() * maxX; newY = Math.random() * maxY; } /* Move button */ noBtn.style.left = newX + "px"; noBtn.style.top = newY + "px"; /* Make Yes progressively bigger */ const scale = 1 + Math.min( dodgeCount * 0.04, 0.5 ); yesBtn.style.transform = `scale(${scale})`; yesBtn.style.fontSize = ( 17 + Math.min( dodgeCount, 8 ) ) + "px"; } /* ========================================= MOUSE DODGE ========================================= */ /* Track mouse over the ENTIRE page. */ document.addEventListener( "mousemove", function(e) { if ( noBtn.style.display === "none" ) { return; } const rect = noBtn.getBoundingClientRect(); const buttonCenterX = rect.left + rect.width / 2; const buttonCenterY = rect.top + rect.height / 2; const distance = Math.sqrt( Math.pow( buttonCenterX - e.clientX, 2 ) + Math.pow( buttonCenterY - e.clientY, 2 ) ); /* Dodge when mouse gets close. */ if ( distance < DODGE_DISTANCE ) { moveNoButton( e.clientX, e.clientY ); } } ); /* ========================================= EXTRA SAFETY ========================================= */ /* If mouse somehow enters button, immediately move it. */ noBtn.addEventListener( "mouseenter", function(e) { moveNoButton( e.clientX, e.clientY ); } ); /* If somehow clicked, move it again. */ noBtn.addEventListener( "click", function(e) { e.preventDefault(); e.stopPropagation(); moveNoButton( e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2 ); } ); /* ========================================= MOBILE TOUCH ========================================= */ noBtn.addEventListener( "touchstart", function(e) { e.preventDefault(); const touch = e.touches[0]; if (touch) { moveNoButton( touch.clientX, touch.clientY ); } }, { passive: false } ); /* ========================================= YES BUTTON ========================================= */ function sayYes() { document.getElementById( "btnRow" ).style.display = "none"; hintText.style.display = "none"; noBtn.style.display = "none"; document.getElementById( "result" ).style.display = "block"; /* Confetti hearts */ for (let i = 0; i < 30; i++) { const h = document.createElement("div"); h.className = "heart"; h.textContent = heartsToUse[ Math.floor( Math.random() * heartsToUse.length ) ]; h.style.left = Math.random() * 100 + "vw"; h.style.fontSize = ( 16 + Math.random() * 24 ) + "px"; h.style.animationDuration = ( 3 + Math.random() * 4 ) + "s"; h.style.animationDelay = ( Math.random() * 1.5 ) + "s"; document.body.appendChild(h); } } </script> </body> </html>
