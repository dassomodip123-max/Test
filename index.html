<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>A Question For You</title>


<style>

/* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;
}


html,
body {
    width: 100%;
    height: 100%;

    overflow: hidden;
}


/* =========================================
   BODY
========================================= */

body {

    font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffdde1,
            #ff9a9e,
            #fecfef,
            #ffc3a0
        );

    background-size: 400% 400%;

    animation:
        gradientShift 10s ease infinite;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    padding: 20px;

    text-align: center;
}


@keyframes gradientShift {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}


/* =========================================
   FLOATING HEARTS
========================================= */

.heart {

    position: absolute;

    top: 100%;

    color:
        rgba(255,255,255,0.75);

    pointer-events: none;

    user-select: none;

    z-index: 1;

    animation:
        floatUp linear infinite;
}


@keyframes floatUp {

    0% {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 1;
    }

    100% {

        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;
    }
}


/* =========================================
   CARD
========================================= */

.card {

    width: 100%;

    max-width: 380px;

    padding:
        36px 24px;

    background:
        rgba(255,255,255,0.88);

    backdrop-filter:
        blur(8px);

    border-radius: 28px;

    box-shadow:
        0 20px 40px
        rgba(255,105,135,0.35);

    position: relative;

    z-index: 10;

    animation:
        popIn 0.7s ease;
}


@keyframes popIn {

    0% {

        transform:
            scale(0.7);

        opacity: 0;
    }

    100% {

        transform:
            scale(1);

        opacity: 1;
    }
}


/* =========================================
   EMOJI
========================================= */

.emoji-top {

    font-size: 46px;

    margin-bottom: 8px;

    display: inline-block;

    animation:
        bounce 1.6s
        ease-in-out
        infinite;
}


@keyframes bounce {

    0%,
    100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-10px);
    }
}


/* =========================================
   TEXT
========================================= */

h1 {

    font-size: 26px;

    color: #d6336c;

    margin-bottom: 6px;

    line-height: 1.3;
}


.name {

    background:
        linear-gradient(
            90deg,
            #ff5e78,
            #ff8fab
        );

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    font-weight: 800;
}


.subtitle {

    font-size: 15px;

    color: #a83a5e;

    margin-bottom: 28px;

    font-weight: 500;
}


/* =========================================
   BUTTON ROW
========================================= */

.btn-row {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 18px;

    min-height: 60px;

    position: relative;
}


/* =========================================
   BUTTONS
========================================= */

button {

    border: none;

    outline: none;

    font-family: inherit;

    font-size: 17px;

    font-weight: 700;

    padding:
        14px 28px;

    border-radius: 50px;

    cursor: pointer;

    -webkit-user-select: none;

    user-select: none;
}


/* =========================================
   YES BUTTON
========================================= */

#yesBtn {

    background:
        linear-gradient(
            135deg,
            #ff5e78,
            #ff8fab
        );

    color: white;

    box-shadow:
        0 10px 20px
        rgba(255,94,120,0.4);

    position: relative;

    z-index: 20;

    /*
       IMPORTANT:
       No size-changing animation.
    */

    transition:
        transform 0.1s ease;
}


#yesBtn:active {

    transform:
        scale(0.95);
}


/* =========================================
   NO BUTTON
========================================= */

#noBtn {

    background:
        #ffe3e9;

    color:
        #d6336c;

    width: 82px;

    height: 50px;

    padding: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    /*
       Starts in normal layout.
    */

    position: relative;

    z-index: 9999;

    /*
       VERY IMPORTANT:
       No transition.
       No animation.
    */

    transition: none;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;

    white-space: nowrap;

    cursor: pointer;
}


/* =========================================
   HINT
========================================= */

.hint {

    margin-top: 18px;

    font-size: 12.5px;

    color: #c17a94;

    opacity: 0.8;
}


/* =========================================
   RESULT
========================================= */

#result {

    display: none;

    margin-top: 26px;

    animation:
        popIn 0.5s ease;
}


#result .big-emoji {

    font-size: 54px;

    margin-bottom: 10px;
}


#result p {

    color:
        #d6336c;

    font-weight:
        700;

    font-size:
        19px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 480px) {

    .card {

        padding:
            28px 18px;
    }

    .btn-row {

        gap:
            12px;
    }

    h1 {

        font-size:
            24px;
    }
}

</style>

</head>


<body>


<!-- =====================================
     CARD
===================================== -->

<div
    class="card"
    id="mainCard">


    <div class="emoji-top">
        💌
    </div>


    <h1>

        Hey cutie🥺

        <span class="name">
            pls pls
        </span>,

    </h1>


    <h1
        style="
            font-size:21px;
            margin-bottom:0;
        ">

        will you be my gf?
        please🥺🥺🥺

    </h1>


    <p class="subtitle">
        .
    </p>


    <!-- BUTTONS -->

    <div
        class="btn-row"
        id="btnRow">


        <button
            id="yesBtn"
            type="button">

            Yes

        </button>


        <button
            id="noBtn"
            type="button">

            No

        </button>


    </div>


    <p
        class="hint"
        id="hintText">

        psst, try clicking "No" 😏

    </p>


    <!-- RESULT -->

    <div id="result">

        <div class="big-emoji">
            🥹💗🎉
        </div>

        <p>

            Yayyy! I knew it 😄

            <br>

            💗💗💗

        </p>

    </div>

</div>



<script>


/* =========================================
   FLOATING HEARTS
========================================= */

const heartsToUse = [

    "💗",
    "💕",
    "💖",
    "💓",
    "💞",
    "🩷"

];


for (
    let i = 0;
    i < 22;
    i++
) {

    const heart =
        document.createElement(
            "div"
        );


    heart.className =
        "heart";


    heart.textContent =
        heartsToUse[
            Math.floor(
                Math.random() *
                heartsToUse.length
            )
        ];


    heart.style.left =
        Math.random() *
        100 +
        "vw";


    heart.style.fontSize =
        (
            14 +
            Math.random() *
            20
        ) +
        "px";


    heart.style.animationDuration =
        (
            5 +
            Math.random() *
            7
        ) +
        "s";


    heart.style.animationDelay =
        (
            Math.random() *
            8
        ) +
        "s";


    document.body.appendChild(
        heart
    );
}



/* =========================================
   ELEMENTS
========================================= */

const noBtn =
    document.getElementById(
        "noBtn"
    );


const yesBtn =
    document.getElementById(
        "yesBtn"
    );


const btnRow =
    document.getElementById(
        "btnRow"
    );


const hintText =
    document.getElementById(
        "hintText"
    );


const result =
    document.getElementById(
        "result"
    );



/* =========================================
   SETTINGS
========================================= */

/*
   How close the mouse can get
   before No escapes.
*/

const ESCAPE_DISTANCE = 140;


/*
   Distance from screen edges.
*/

const EDGE = 12;


/*
   Has No moved into fixed mode?
*/

let noIsMoving = false;


/*
   Last mouse position.
*/

let mouseX = -9999;

let mouseY = -9999;


/*
   Dodge count.
*/

let dodgeCount = 0;


/*
   Prevent accidental duplicate
   moves during the same event.
*/

let dodgeLock = false;


/*
   Page finished?
*/

let accepted = false;



/* =========================================
   MESSAGES
========================================= */

const teaseMessages = [

    'psst, try clicking "No" 😏',

    "Nice try 😏",

    "Nope, not happening 🙅‍♀️",

    "Catch me if you can 🏃‍♀️",

    "Come onnn, click Yes already 😩",

    "The No button is shy 🙈",

    "Almost got me 😂",

    "Too slow 😌",

    "Still trying? 😂",

    "No chance 😏",

    "Just click Yes 🥺",

    "You cannot catch me 💗",

    "Give up already 😭"

];



/* =========================================
   GET SAFE RANDOM POSITION
========================================= */

function getSafePosition(
    pointerX,
    pointerY
) {


    const width =
        noBtn.offsetWidth;


    const height =
        noBtn.offsetHeight;


    const maxX =
        window.innerWidth -
        width -
        EDGE;


    const maxY =
        window.innerHeight -
        height -
        EDGE;


    /*
       Keep a candidate that is
       as far away as possible.
    */

    let bestX = EDGE;

    let bestY = EDGE;

    let bestDistance = 0;


    /*
       Try 150 locations.
    */

    for (
        let i = 0;
        i < 150;
        i++
    ) {


        const x =
            EDGE +
            Math.random() *
            Math.max(
                1,
                maxX - EDGE
            );


        const y =
            EDGE +
            Math.random() *
            Math.max(
                1,
                maxY - EDGE
            );


        const centerX =
            x +
            width / 2;


        const centerY =
            y +
            height / 2;


        const distance =
            Math.hypot(

                centerX -
                pointerX,

                centerY -
                pointerY

            );


        /*
           Remember the farthest.
        */

        if (
            distance >
            bestDistance
        ) {

            bestDistance =
                distance;

            bestX = x;

            bestY = y;
        }


        /*
           Good enough.
        */

        if (
            distance >
            ESCAPE_DISTANCE +
            80
        ) {

            return {
                x: x,
                y: y
            };

        }

    }


    return {

        x: bestX,

        y: bestY

    };

}



/* =========================================
   MOVE NO BUTTON
========================================= */

function moveNoButton(
    pointerX,
    pointerY
) {


    /*
       Don't move after Yes.
    */

    if (accepted) {
        return;
    }


    /*
       Prevent duplicate event
       spam.
    */

    if (dodgeLock) {
        return;
    }


    dodgeLock = true;


    dodgeCount++;


    /*
       Update message.
    */

    hintText.textContent =
        teaseMessages[
            Math.min(
                dodgeCount - 1,
                teaseMessages.length - 1
            )
        ];


    /*
       FIRST MOVE:
       Change from normal layout
       to fixed positioning.

       We calculate the current
       screen position FIRST so
       there is NO visual jump.
    */

    if (!noIsMoving) {


        const rect =
            noBtn.getBoundingClientRect();


        noBtn.style.position =
            "fixed";


        noBtn.style.left =
            rect.left + "px";


        noBtn.style.top =
            rect.top + "px";


        noBtn.style.margin =
            "0";


        noIsMoving = true;

    }


    /*
       Find a safe location.
    */

    const position =
        getSafePosition(
            pointerX,
            pointerY
        );


    /*
       Move using left/top.
    */

    noBtn.style.left =
        position.x + "px";


    noBtn.style.top =
        position.y + "px";


    /*
       Unlock on next frame.
    */

    requestAnimationFrame(
        function() {

            dodgeLock = false;

        }
    );

}



/* =========================================
   MOUSE TRACKING
========================================= */

document.addEventListener(
    "mousemove",
    function(e) {


        if (accepted) {
            return;
        }


        mouseX =
            e.clientX;


        mouseY =
            e.clientY;


        /*
           Get current No position.
        */

        const rect =
            noBtn.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        /*
           Distance between cursor
           and No button.
        */

        const distance =
            Math.hypot(

                centerX -
                mouseX,

                centerY -
                mouseY

            );


        /*
           Escape before mouse
           reaches the button.
        */

        if (
            distance <
            ESCAPE_DISTANCE
        ) {

            moveNoButton(
                mouseX,
                mouseY
            );

        }

    }
);



/* =========================================
   MOUSE ENTER
========================================= */

noBtn.addEventListener(
    "mouseenter",
    function(e) {


        moveNoButton(
            e.clientX,
            e.clientY
        );

    }
);



/* =========================================
   NO CLICK
========================================= */

noBtn.addEventListener(
    "click",
    function(e) {


        /*
           NEVER allow No click.
        */

        e.preventDefault();

        e.stopPropagation();


        moveNoButton(
            e.clientX ||
            mouseX,

            e.clientY ||
            mouseY
        );

    }
);



/* =========================================
   TOUCH START
========================================= */

noBtn.addEventListener(
    "touchstart",
    function(e) {


        /*
           Prevent normal click.
        */

        e.preventDefault();

        e.stopPropagation();


        const touch =
            e.touches[0];


        if (!touch) {
            return;
        }


        moveNoButton(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive: false
    }
);



/* =========================================
   TOUCH MOVE
========================================= */

noBtn.addEventListener(
    "touchmove",
    function(e) {


        e.preventDefault();

        e.stopPropagation();


        const touch =
            e.touches[0];


        if (!touch) {
            return;
        }


        moveNoButton(
            touch.clientX,
            touch.clientY
        );

    },
    {
        passive: false
    }
);



/* =========================================
   PREVENT CONTEXT MENU
========================================= */

noBtn.addEventListener(
    "contextmenu",
    function(e) {

        e.preventDefault();

    }
);



/* =========================================
   YES BUTTON
========================================= */

yesBtn.addEventListener(
    "click",
    function() {


        /*
           Mark accepted.
        */

        accepted = true;


        /*
           Hide buttons.
        */

        btnRow.style.display =
            "none";


        /*
           Hide hint.
        */

        hintText.style.display =
            "none";


        /*
           Show result.
        */

        result.style.display =
            "block";


        /*
           Celebration hearts.
        */

        createCelebration();

    }
);



/* =========================================
   CELEBRATION
========================================= */

function createCelebration() {


    for (
        let i = 0;
        i < 35;
        i++
    ) {


        const heart =
            document.createElement(
                "div"
            );


        heart.className =
            "heart";


        heart.textContent =
            heartsToUse[
                Math.floor(
                    Math.random() *
                    heartsToUse.length
                )
            ];


        heart.style.left =
            Math.random() *
            100 +
            "vw";


        heart.style.fontSize =
            (
                16 +
                Math.random() *
                24
            ) +
            "px";


        heart.style.animationDuration =
            (
                3 +
                Math.random() *
                4
            ) +
            "s";


        heart.style.animationDelay =
            (
                Math.random() *
                1.5
            ) +
            "s";


        document.body.appendChild(
            heart
        );

    }

}



/* =========================================
   RESIZE PROTECTION
========================================= */

window.addEventListener(
    "resize",
    function() {


        if (
            !noIsMoving ||
            accepted
        ) {
            return;
        }


        const width =
            noBtn.offsetWidth;


        const height =
            noBtn.offsetHeight;


        const maxX =
            window.innerWidth -
            width -
            EDGE;


        const maxY =
            window.innerHeight -
            height -
            EDGE;


        const rect =
            noBtn.getBoundingClientRect();


        const x =
            Math.max(
                EDGE,
                Math.min(
                    rect.left,
                    maxX
                )
            );


        const y =
            Math.max(
                EDGE,
                Math.min(
                    rect.top,
                    maxY
                )
            );


        noBtn.style.left =
            x + "px";


        noBtn.style.top =
            y + "px";

    }
);

</script>


</body>
</html>
