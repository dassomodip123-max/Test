<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A Question For Tulika 💗</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #ffdde1, #ff9a9e, #fecfef, #ffc3a0);
    background-size: 400% 400%;
    animation: gradientShift 10s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 20px;
    text-align: center;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .heart {
    position: absolute;
    top: 100%;
    color: rgba(255,255,255,0.75);
    font-size: 20px;
    pointer-events: none;
    animation: floatUp linear infinite;
    user-select: none;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    border-radius: 28px;
    padding: 36px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(255, 105, 135, 0.35);
    z-index: 2;
    position: relative;
    animation: popIn 0.7s ease;
  }

  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .emoji-top {
    font-size: 46px;
    margin-bottom: 8px;
    display: inline-block;
    animation: bounce 1.6s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-size: 26px;
    color: #d6336c;
    margin-bottom: 6px;
    line-height: 1.3;
  }

  .name {
    background: linear-gradient(90deg, #ff5e78, #ff8fab);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
  }

  .subtitle {
    font-size: 15px;
    color: #a83a5e;
    margin-bottom: 28px;
    font-weight: 500;
  }

  .btn-row {
    display: flex;
    justify-content: center;
    gap: 18px;
    position: relative;
    min-height: 60px;
    align-items: center;
  }

  button {
    border: none;
    outline: none;
    font-size: 17px;
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
  }

  #yesBtn {
    background: linear-gradient(135deg, #ff5e78, #ff8fab);
    color: white;
    box-shadow: 0 10px 20px rgba(255, 94, 120, 0.4);
    transition: transform 0.2s ease;
  }

  #yesBtn:active {
    transform: scale(0.95);
  }

  #noBtn {
    background: #ffe3e9;
    color: #d6336c;
    position: relative;
    transition: transform 0.15s ease;
  }

  #result {
    display: none;
    margin-top: 26px;
    animation: popIn 0.5s ease;
  }

  #result .big-emoji {
    font-size: 54px;
    margin-bottom: 10px;
  }

  #result p {
    color: #d6336c;
    font-weight: 700;
    font-size: 19px;
  }

  .yes-size {
    transition: all 0.25s ease;
  }

  .hint {
    margin-top: 18px;
    font-size: 12.5px;
    color: #c17a94;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="card" id="mainCard">
  <div class="emoji-top">💌</div>
  <h1>Hey <span class="name">Tulika</span>,</h1>
  <h1 style="font-size:21px; margin-bottom:0;">will you be my girlfriend?</h1>
  <p class="subtitle">take your time... but the answer is kinda obvious 👀</p>

  <div class="btn-row" id="btnRow">
    <button id="yesBtn" class="yes-size" onclick="sayYes()">Yes 😍</button>
    <button id="noBtn">No 🙈</button>
  </div>

  <p class="hint" id="hintText">psst, try clicking "No" 😏</p>

  <div id="result">
    <div class="big-emoji">🥹💗🎉</div>
    <p>Yayyy! I knew it 😄<br>You just made me the happiest.</p>
  </div>
</div>

<script>
  // floating hearts background
  const heartsToUse = ["💗","💕","💖","💓","💞","🩷"];
  for (let i = 0; i < 22; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = heartsToUse[Math.floor(Math.random() * heartsToUse.length)];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = (14 + Math.random() * 20) + "px";
    h.style.animationDuration = (5 + Math.random() * 7) + "s";
    h.style.animationDelay = (Math.random() * 8) + "s";
    document.body.appendChild(h);
  }

  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const btnRow = document.getElementById("btnRow");
  const hintText = document.getElementById("hintText");

  let dodgeCount = 0;
  const teaseMessages = [
    "psst, try clicking \"No\" 😏",
    "nice try 😏",
    "nope, not happening 🙅‍♀️",
    "catch me if you can 🏃‍♀️",
    "come onnn, click Yes already 😩",
    "the No button is shy 🙈",
    "it's just not into being clicked 😂",
    "give up yet? 😌"
  ];

  function moveNoButton() {
    dodgeCount++;
    hintText.textContent = teaseMessages[Math.min(dodgeCount, teaseMessages.length - 1)];

    const rowRect = btnRow.getBoundingClientRect();
    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;

    // random position within viewport, avoiding edges
    const maxX = window.innerWidth - btnW - 20;
    const maxY = window.innerHeight - btnH - 20;
    const randX = Math.max(20, Math.random() * maxX);
    const randY = Math.max(20, Math.random() * maxY);

    noBtn.style.position = "fixed";
    noBtn.style.left = randX + "px";
    noBtn.style.top = randY + "px";
    noBtn.style.zIndex = "50";

    // grow Yes button a little each time to nudge the choice
    const currentScale = 1 + Math.min(dodgeCount * 0.06, 0.5);
    yesBtn.style.transform = `scale(${currentScale})`;
    yesBtn.style.fontSize = (17 + Math.min(dodgeCount, 8)) + "px";
  }

  // desktop hover dodge
  noBtn.addEventListener("mouseenter", moveNoButton);
  // mobile touch dodge (fires before any click can register)
  noBtn.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveNoButton();
  }, { passive: false });

  // extra safety: even if somehow "clicked", do nothing
  noBtn.addEventListener("click", function(e) {
    e.preventDefault();
    moveNoButton();
  });

  function sayYes() {
    document.getElementById("btnRow").style.display = "none";
    hintText.style.display = "none";
    noBtn.style.display = "none";
    document.getElementById("result").style.display = "block";

    // little confetti burst of hearts
    for (let i = 0; i < 30; i++) {
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = heartsToUse[Math.floor(Math.random() * heartsToUse.length)];
      h.style.left = Math.random() * 100 + "vw";
      h.style.fontSize = (16 + Math.random() * 24) + "px";
      h.style.animationDuration = (3 + Math.random() * 4) + "s";
      h.style.animationDelay = (Math.random() * 1.5) + "s";
      document.body.appendChild(h);
    }
  }
</script>

</body>
  </html>
